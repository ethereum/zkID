[workspace]
members = [
    "wallet-unit-poc/ecdsa-spartan2",
]
# lto and codegen-units can only be set workspace-wide, so crates that tune them
# stay standalone with their own lockfile and [profile.release].
exclude = [
    "wallet-unit-poc/mobile",
    "wallet-unit-poc/mobile/mopro_flutter_bindings/rust",
    "wallet-unit-poc/openac-sdk/wasm",
]
resolver = "2"

[profile.release.package.ecdsa-spartan2]
debug = true
