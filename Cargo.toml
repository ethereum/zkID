[workspace]
members = [
    "wallet-unit-poc/ecdsa-spartan2",
]
# Cargo ignores [profile] outside the workspace root and can't set lto per
# package, so crates with their own release profile stay standalone.
exclude = [
    "wallet-unit-poc/mobile",
    "wallet-unit-poc/openac-sdk/wasm",
]
resolver = "2"

[profile.release]
debug = true
